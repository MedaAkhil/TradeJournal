<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Calendar - Trade Journal Pro</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <style>
        /* ============ TERMINAL TRADING PALETTE (same as index.html) ============ */
        :root {
            --bg-base:        #080d14;
            --bg-panel:       #0d1420;
            --bg-elevated:    #111c2d;
            --bg-hover:       #162033;
            --border:         #1e2d45;
            --border-bright:  #2a3f5f;

            --bull:           #00d97e;
            --bull-dim:       rgba(0,217,126,0.12);
            --bull-border:    rgba(0,217,126,0.25);
            --bear:           #ff4560;
            --bear-dim:       rgba(255,69,96,0.12);
            --bear-border:    rgba(255,69,96,0.25);
            --accent:         #3d8ef8;
            --accent-dim:     rgba(61,142,248,0.15);
            --accent-border:  rgba(61,142,248,0.3);
            --gold:           #f5a623;
            --gold-dim:       rgba(245,166,35,0.12);
            --gold-border:    rgba(245,166,35,0.3);

            --text-bright:    #e8f0fe;
            --text-primary:   #a8bacf;
            --text-secondary: #5a7494;
            --text-dim:       #354860;

            --font-mono: 'JetBrains Mono', monospace;
            --font-display: 'Syne', sans-serif;

            --r-sm: 4px;
            --r-md: 6px;
            --r-lg: 10px;

            --glow-bull: 0 0 16px rgba(0,217,126,0.2);
            --glow-bear: 0 0 16px rgba(255,69,96,0.2);
            --glow-accent: 0 0 16px rgba(61,142,248,0.2);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-mono);
            background: var(--bg-base);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(61,142,248,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(61,142,248,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* ==================== NAVBAR ==================== */
        .navbar {
            background: rgba(8,13,20,0.96) !important;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(20px);
            padding: 0 1.5rem;
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -0.02em;
            color: var(--text-bright) !important;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .brand-icon {
            width: 30px; height: 30px;
            background: linear-gradient(135deg, var(--bull), var(--accent));
            border-radius: var(--r-sm);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem;
            color: #000;
        }

        .brand-badge {
            font-size: 0.55rem;
            font-family: var(--font-mono);
            font-weight: 600;
            color: var(--bull);
            background: var(--bull-dim);
            border: 1px solid var(--bull-border);
            padding: 1px 6px;
            border-radius: 3px;
            letter-spacing: 0.08em;
        }

        .navbar-nav { gap: 0.25rem; }

        .nav-link {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: var(--text-secondary) !important;
            padding: 0.35rem 0.85rem !important;
            border-radius: var(--r-sm);
            border: 1px solid transparent;
            transition: all 0.15s ease;
            display: flex !important;
            align-items: center;
            gap: 0.4rem;
            text-transform: uppercase;
        }

        .nav-link i { font-size: 0.7rem; }
        .nav-link:hover { color: var(--text-bright) !important; background: var(--bg-elevated); border-color: var(--border); }
        .nav-link.active { color: var(--accent) !important; background: var(--accent-dim); border-color: var(--accent-border); }

        /* ==================== MAIN WRAP ==================== */
        .main-wrap {
            position: relative;
            z-index: 1;
            max-width: 1300px;
            margin: 0 auto;
            padding: 1.5rem 1.5rem 5rem;
        }

        /* ==================== PAGE HEADER ==================== */
        .page-title {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .page-title::before {
            content: '';
            width: 6px; height: 6px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: var(--glow-accent);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ==================== CALENDAR NAV ==================== */
        .calendar-nav {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 0.85rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
        }

        .calendar-nav button {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.45rem 1.1rem;
            border-radius: var(--r-sm);
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 600;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .calendar-nav button:hover {
            background: var(--accent-dim);
            border-color: var(--accent-border);
            color: var(--accent);
        }

        .month-label {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-bright);
            letter-spacing: -0.01em;
        }

        .month-label span {
            color: var(--accent);
        }

        /* ==================== CALENDAR GRID ==================== */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            overflow: hidden;
            margin-bottom: 1.25rem;
        }

        .calendar-header {
            background: var(--bg-base);
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-dim);
            padding: 0.65rem 0.5rem;
        }

        /* ==================== CALENDAR DAYS ==================== */
        .calendar-day {
            background: var(--bg-panel);
            padding: 0.7rem 0.75rem;
            min-height: 90px;
            position: relative;
            cursor: pointer;
            transition: background 0.12s;
            display: flex;
            flex-direction: column;
        }

        .calendar-day:hover { background: var(--bg-hover); }

        .calendar-day.other-month {
            background: var(--bg-base);
            opacity: 0.4;
            cursor: default;
        }

        .calendar-day.selected-day {
            background: var(--accent-dim);
            outline: 1px solid var(--accent-border);
        }

        /* P&L color states */
        .calendar-day.profitable-day {
            border-left: 2px solid var(--bull);
            background: linear-gradient(135deg, rgba(0,217,126,0.07) 0%, var(--bg-panel) 60%);
        }

        .calendar-day.losing-day {
            border-left: 2px solid var(--bear);
            background: linear-gradient(135deg, rgba(255,69,96,0.07) 0%, var(--bg-panel) 60%);
        }

        .calendar-day.breakeven-day {
            border-left: 2px solid var(--gold);
            background: linear-gradient(135deg, rgba(245,166,35,0.07) 0%, var(--bg-panel) 60%);
        }

        /* Expiry indicators */
        .calendar-day.nifty-expiry  { border-right: 2px solid var(--accent); }
        .calendar-day.sensex-expiry { border-right: 2px solid var(--gold); }

        .expiry-badge {
            position: absolute;
            top: 5px;
            right: 6px;
            font-family: var(--font-mono);
            font-size: 0.5rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            padding: 1px 5px;
            border-radius: 2px;
        }

        .expiry-badge.nifty  { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent-border); }
        .expiry-badge.sensex { background: var(--gold-dim);   color: var(--gold);   border: 1px solid var(--gold-border); }

        .day-number {
            font-family: var(--font-mono);
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-bright);
            line-height: 1;
        }

        .calendar-day.other-month .day-number { color: var(--text-dim); }

        /* Today highlight */
        .calendar-day.today .day-number {
            color: var(--accent);
        }

        .calendar-day.today::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--accent);
        }

        .day-info {
            margin-top: auto;
        }

        .day-trade-count {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 0.2rem;
        }

        .day-pnl-value {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 700;
        }

        .day-pnl-value.bull { color: var(--bull); }
        .day-pnl-value.bear { color: var(--bear); }
        .day-pnl-value.flat { color: var(--gold); }

        /* ==================== LEGEND ==================== */
        .calendar-legend {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 0.85rem 1.25rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .legend-label {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-right: 0.5rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        .legend-swatch {
            width: 20px; height: 14px;
            border-radius: 2px;
        }

        .legend-swatch.bull    { background: var(--bull-dim); border-left: 2px solid var(--bull); }
        .legend-swatch.bear    { background: var(--bear-dim); border-left: 2px solid var(--bear); }
        .legend-swatch.flat    { background: var(--gold-dim); border-left: 2px solid var(--gold); }
        .legend-swatch.empty   { background: var(--bg-elevated); border: 1px solid var(--border); }
        .legend-swatch.nifty   { background: var(--accent-dim); border-right: 2px solid var(--accent); }
        .legend-swatch.sensex  { background: var(--gold-dim);   border-right: 2px solid var(--gold); }

        /* ==================== SELECTED DAY SUMMARY ==================== */
        .selected-day-summary {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            overflow: hidden;
            margin-top: 1.25rem;
        }

        .summary-header {
            background: var(--bg-base);
            border-bottom: 1px solid var(--border);
            padding: 0.85rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .summary-date {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-bright);
        }

        .summary-body {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--border);
        }

        .stat-cell {
            background: var(--bg-panel);
            padding: 1.1rem 1.25rem;
            position: relative;
            transition: background 0.12s;
        }

        .stat-cell:hover { background: var(--bg-hover); }

        .stat-cell::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
        }

        .stat-cell:nth-child(1)::after { background: var(--accent); }
        .stat-cell:nth-child(2)::after { background: var(--bull); }
        .stat-cell:nth-child(3)::after { background: var(--gold); }

        .stat-label {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 0.4rem;
        }

        .stat-value {
            font-family: var(--font-mono);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-bright);
            line-height: 1;
        }

        .stat-value.bull { color: var(--bull); text-shadow: var(--glow-bull); }
        .stat-value.bear { color: var(--bear); text-shadow: var(--glow-bear); }

        .summary-footer {
            background: var(--bg-base);
            border-top: 1px solid var(--border);
            padding: 0.85rem 1.25rem;
        }

        .view-day-btn {
            background: var(--accent-dim);
            border: 1px solid var(--accent-border);
            color: var(--accent);
            padding: 0.5rem 1.25rem;
            border-radius: var(--r-sm);
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .view-day-btn:hover {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        /* ==================== SECTION LABEL ==================== */
        .section-label {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.75rem;
        }

        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ==================== SCROLLBAR ==================== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 900px) {
            .summary-body { grid-template-columns: 1fr 1fr 1fr; }
        }

        @media (max-width: 640px) {
            .main-wrap { padding: 1rem 0.85rem 4rem; }
            .calendar-nav { flex-direction: column; gap: 0.6rem; }
            .calendar-nav button { width: 100%; justify-content: center; }
            .calendar-day { min-height: 68px; padding: 0.5rem; }
            .day-number { font-size: 0.78rem; }
            .day-pnl-value { font-size: 0.68rem; }
            .calendar-legend { gap: 0.85rem; }
            .summary-body { grid-template-columns: 1fr; }
        }

        @media (max-width: 420px) {
            .calendar-day { min-height: 56px; padding: 0.4rem; }
            .day-number { font-size: 0.7rem; }
            .expiry-badge { display: none; }
        }

        /* Compat classes used by app.js */
        .text-success { color: var(--bull) !important; font-weight: 700; }
        .text-danger  { color: var(--bear) !important; font-weight: 700; }
        .profit { color: var(--bull) !important; font-weight: bold; }
        .loss   { color: var(--bear) !important; font-weight: bold; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        button:focus-visible, .calendar-day:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <!-- ========== NAVBAR ========== -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">
                <div class="brand-icon"><i class="fas fa-chart-line"></i></div>
                TradeJournal <span class="brand-badge">PRO</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>

            <div class="collapse navbar-collapse" id="navbarNav">

                            <i class="fas fa-book"></i>Journal

                    </li>
                    <li class="nav-item">

                            <i class="fas fa-calendar"></i>Calendar
                        </a>
                    </li>
                    <li class="nav-item">

                        </a>
                    </li>
                    <li class="nav-item">

                            <i class="fas fa-note-sticky"></i>Notes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            <i class="fas fa-chart-pie"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="export.html">
                            <i class="fas fa-download"></i>Backup
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ========== MAIN ========== -->
    <div class="main-wrap">

        <div class="page-title">Monthly Calendar View</div>

        <!-- Month Navigation -->
        <div class="calendar-nav">
            <button onclick="changeMonth(-1)">
                <i class="fas fa-chevron-left"></i> Previous
            </button>
            <div class="month-label" id="currentMonthYear">March <span>2026</span></div>
            <button onclick="changeMonth(1)">
                Next <i class="fas fa-chevron-right"></i>
            </button>
        </div>

        <!-- Section label -->
        <div class="section-label">Trade Days</div>

        <!-- Calendar Grid -->
        <div class="calendar-grid" id="calendarGrid">
            <div class="calendar-header">Sun</div>
            <div class="calendar-header">Mon</div>
            <div class="calendar-header">Tue</div>
            <div class="calendar-header">Wed</div>
            <div class="calendar-header">Thu</div>
            <div class="calendar-header">Fri</div>
            <div class="calendar-header">Sat</div>
            <!-- Days injected by app.js -->
        </div>

        <!-- Legend -->
        <div class="calendar-legend">
            <span class="legend-label">Key —</span>
            <div class="legend-item">
                <span class="legend-swatch bull"></span> Profitable
            </div>
            <div class="legend-item">
                <span class="legend-swatch bear"></span> Loss
            </div>
            <div class="legend-item">
                <span class="legend-swatch flat"></span> Breakeven
            </div>
            <div class="legend-item">
                <span class="legend-swatch empty"></span> No Trades
            </div>
            <div class="legend-item">
                <span class="legend-swatch nifty"></span> Nifty Expiry (Tue)
            </div>
            <div class="legend-item">
                <span class="legend-swatch sensex"></span> Sensex Expiry (Thu)
            </div>
        </div>

        <!-- Selected Day Summary -->
        <div class="selected-day-summary" id="selectedDaySummary" style="display: none;">
            <div class="summary-header">
                <div class="summary-date" id="selectedDate">March 13, 2026</div>
            </div>
            <div class="summary-body">
                <div class="stat-cell">
                    <div class="stat-label">Trades</div>
                    <div class="stat-value" id="summaryTrades">0</div>
                </div>
                <div class="stat-cell">
                    <div class="stat-label">P&amp;L</div>
                    <div class="stat-value" id="summaryPnL">₹0.00</div>
                </div>
                <div class="stat-cell">
                    <div class="stat-label">Win Rate</div>
                    <div class="stat-value" id="summaryWinRate">—</div>
                </div>
            </div>
            <div class="summary-footer">
                <button class="view-day-btn" onclick="goToDate()">
                    <i class="fas fa-arrow-right"></i> Open Day Journal
                </button>
            </div>
        </div>

    </div><!-- /main-wrap -->

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
